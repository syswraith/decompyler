[project]
name = "decompyler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "syswraith", email = "syswraith@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "pygments>=2.21.0",
    "pyinstxtractor-ng>=2026.7.3",
    "pyside6>=6.12.0",
]

[project.scripts]
decompyler = "decompyler:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

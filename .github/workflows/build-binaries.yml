name: Build and Release Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'  # Trigger release when a version tag like v1.0.0 is pushed
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
          - os: windows-latest
            artifact_name: windows
          - os: macos-latest
            artifact_name: macos

    steps:
      - name: Checkout Decompyler Repository
        uses: actions/checkout@v4

      - name: Clone pycdc Source
        uses: actions/checkout@v4
        with:
          repository: zrax/pycdc
          path: pycdc-source
          submodules: recursive

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir pycdc-source/build
          cd pycdc-source/build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build Binaries (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd pycdc-source/build
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cd pycdc-source
          mkdir build
          cd build
          cmake .. -A x64
          cmake --build . --config Release

      - name: Organize Built Binaries
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv pycdc-source/build/Release/pycdc.exe staging/pycdc-${{ matrix.artifact_name }}.exe
            mv pycdc-source/build/Release/pycdas.exe staging/pycdas-${{ matrix.artifact_name }}.exe
          else
            mv pycdc-source/build/pycdc staging/pycdc-${{ matrix.artifact_name }}
            mv pycdc-source/build/pycdas staging/pycdas-${{ matrix.artifact_name }}
            chmod +x staging/*
          fi

      - name: Upload Artifacts for Release
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_name }}
          path: staging/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only run release job on version tags
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Display structure of downloaded files
        run: ls -R all-binaries

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-binaries/binaries-linux/*
            all-binaries/binaries-windows/*
            all-binaries/binaries-macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

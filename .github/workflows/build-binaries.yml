name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: decompyler-linux
            exe_ext: ""
          - os: windows-latest
            artifact_name: decompyler-windows.exe
            exe_ext: ".exe"
          - os: macos-latest
            artifact_name: decompyler-macos
            exe_ext: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked

      - name: Install Qt Runtime Libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Clone and Build pycdc Source
        uses: actions/checkout@v4
        with:
          repository: zrax/pycdc
          path: pycdc-source
          submodules: recursive

      - name: Compile pycdc (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir pycdc-source/build && cd pycdc-source/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Compile pycdc (Windows)
        if: runner.os == 'Windows'
        run: |
          cd pycdc-source && mkdir build && cd build
          cmake .. -A x64
          cmake --build . --config Release

      - name: Place Binaries into Project Structure
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mkdir -p src/decompyler/bin/windows
            cp pycdc-source/build/Release/pycdc.exe src/decompyler/bin/windows/
            cp pycdc-source/build/Release/pycdas.exe src/decompyler/bin/windows/
          elif [ "${{ runner.os }}" == "macOS" ]; then
            mkdir -p src/decompyler/bin/macos
            cp pycdc-source/build/pycdc src/decompyler/bin/macos/
            cp pycdc-source/build/pycdas src/decompyler/bin/macos/
            chmod +x src/decompyler/bin/macos/*
          else
            mkdir -p src/decompyler/bin/linux
            cp pycdc-source/build/pycdc src/decompyler/bin/linux/
            cp pycdc-source/build/pycdas src/decompyler/bin/linux/
            chmod +x src/decompyler/bin/linux/*
          fi

      - name: Build Standalone Executable with PyInstaller
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean decompyler.spec

      - name: Smoke Test Executable
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./dist/decompyler.exe --self-check
          else
            ./dist/decompyler --self-check
          fi

      - name: Rename Executable Asset
        shell: bash
        run: |
          mkdir -p release_staging
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/decompyler.exe release_staging/${{ matrix.artifact_name }}
          else
            mv dist/decompyler release_staging/${{ matrix.artifact_name }}
          fi

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: release_staging/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release and Upload Executables
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/artifact-ubuntu-latest/*
            all-artifacts/artifact-windows-latest/*
            all-artifacts/artifact-macos-latest/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
